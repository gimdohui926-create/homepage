<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>셀프 진단 · BeautyPalette</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="test">

  <main class="test-wrap">
    <div class="steps" id="steps"></div>
    <div class="progress"><div id="progress"></div></div>

    <p class="q-count" id="q-count"></p>
    <h1 class="q-title" id="q-title"></h1>
    <p class="q-hint" id="q-hint"></p>

    <div class="options" id="options"></div>

    <div class="test-nav">
      <button class="btn btn-outline" id="prev">← 이전</button>
      <button class="btn-restart" id="restart">
        <span class="icon">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
        </span>
        처음부터 다시 하기
      </button>
      <button class="btn" id="next">다음 <span class="arrow">→</span></button>
    </div>
  </main>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
